name: Daily Health Sync

on:
  schedule:
    # Run every day at 21:30 UTC = 06:30 JST (Japan Standard Time)
    - cron: '30 21 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Python Dependencies
        run: pip install pyvesync

      - name: Run Daily Sync (Garmin + VeSync)
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          VESYNC_EMAIL: ${{ secrets.VESYNC_EMAIL }}
          VESYNC_PASSWORD: ${{ secrets.VESYNC_PASSWORD }}
          WHYMAN_APP_URL: ${{ secrets.WHYMAN_APP_URL }}
        run: node scripts/daily-sync.js
