name: Run BotBas Discord Bot

on:
  push:
    branches:
      - main
  workflow_dispatch: # เปิดให้คุณกดรันบอทด้วยตนเองได้ผ่านหน้าเว็บ GitHub (Actions tab)

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BotBas Service
        env:
          # ดึงข้อมูลตัวแปรความปลอดภัยจาก GitHub Secrets
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RADETCH_API_URL: ${{ secrets.RADETCH_API_URL }}
        run: python main.py
